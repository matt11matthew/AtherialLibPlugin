name: Build and Release

on:
  push:
    branches: [ master ]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload artifact (Snapshot or Release)
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.event_name == 'release' && github.event.release.name || 'Snapshot Release' }}
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || 'snapshot' }}
          files: |
            target/AtherialLibPlugin.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
